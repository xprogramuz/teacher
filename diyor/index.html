<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диёрим учун</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;500;700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{
  /* "Рангли тушлар": a night sky with soft colourful dreams, one centred reading column */
  --night:#14101f;
  --night-2:#1e1830;
  --ink:#f3eef8;
  --muted:#b9aecb;
  --rose:#ff8fb1;
  --gold:#ffd27a;
  --line:rgba(255,255,255,.12);
  --display:"Lora", Georgia, "Times New Roman", serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --hand:"Marck Script", "Segoe Script", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.65;overflow-x:hidden}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:56px 20px 80px;display:flex;flex-direction:column;gap:72px}
h1,h2{font-family:var(--display);font-weight:500;text-wrap:balance;line-height:1.2}
.hand{font-family:var(--hand);color:var(--rose)}
header{display:flex;flex-direction:column;gap:14px;padding-top:24px}
header .hand{font-size:clamp(2.6rem,9vw,4rem);line-height:1}
header h1{font-size:clamp(1.7rem,5vw,2.4rem);font-style:italic}
header p{color:var(--muted);max-width:60ch}
.label{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
section{display:flex;flex-direction:column;gap:20px}
section h2{font-size:clamp(1.4rem,4vw,1.8rem)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--night-2);padding:20px 18px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-size:2.1rem;font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:.92rem}

.timeline{list-style:none;padding:0;display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 28px 24px;display:flex;flex-direction:column;gap:6px}
.timeline li::before{content:"";position:absolute;left:-5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 12px var(--rose)}
.timeline time{font-size:.8rem;color:var(--gold);font-weight:700;letter-spacing:.06em}
.quote{font-family:var(--display);font-style:italic;font-size:1.12rem}
.timeline p:not(.quote){color:var(--muted)}

.fears{display:flex;flex-direction:column;gap:16px}
.fear{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:rgba(30,24,48,.7);display:flex;flex-direction:column;gap:8px}
.fear .her{color:var(--muted);font-size:.95rem}
.fear .her::before{content:"Сен: ";color:var(--rose);font-weight:700}
.fear .me{font-family:var(--display);font-size:1.08rem}
.fear .me::before{content:"Мен: ";font-family:var(--body);color:var(--gold);font-weight:700;font-size:.95rem}

.names{display:flex;flex-wrap:wrap;gap:10px}
.names span{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.95rem;background:rgba(255,143,177,.08)}

.final{align-items:center;text-align:center;padding:36px 20px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(255,143,177,.14),rgba(255,210,122,.08))}
.final .hand{font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.1}
.final p{color:var(--muted);max-width:46ch}
.btns{position:relative;display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px;width:100%;flex-wrap:wrap}
button{font-family:var(--body);font-size:1rem;font-weight:700;border-radius:999px;padding:13px 28px;cursor:pointer;border:1px solid transparent;transition:transform .2s}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#yes{background:var(--rose);color:#2a0f1c}
#yes:hover{transform:scale(1.06)}
#no{background:transparent;color:var(--muted);border-color:var(--line)}
#answer{font-family:var(--display);font-size:1.25rem;font-style:italic;color:var(--ink);min-height:1.6em}
footer{text-align:center;color:var(--muted);font-size:.85rem}
.happy{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.joy{position:relative;border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px;background:rgba(30,24,48,.75);display:flex;flex-direction:column;gap:6px;transition:transform .3s,border-color .3s;animation:bob 5s ease-in-out infinite}
.joy:nth-child(2n){animation-delay:-2.5s}
.joy:nth-child(3n){animation-delay:-1.2s}
.joy:hover{transform:translateY(-4px) rotate(-.6deg);border-color:var(--rose)}
.joy time{font-size:.78rem;color:var(--gold);font-weight:700;letter-spacing:.06em}
.joy p:not(.quote){color:var(--muted);font-size:.95rem}
.joy .emo{position:absolute;top:-14px;right:14px;font-size:1.8rem;animation:wiggle 2.4s ease-in-out infinite}
.beat{display:inline-block;animation:beat 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes wiggle{0%,100%{rotate:-8deg}50%{rotate:10deg}}
@keyframes beat{0%,100%{scale:1}15%{scale:1.12}30%{scale:1}45%{scale:1.08}}
.tap-hint{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.joy,.joy .emo,.beat{animation:none}}
body.locked main{display:none}
#lock{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 20px}
#lock[hidden]{display:none}
.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;padding:28px 24px;border:1px solid var(--line);border-radius:20px;background:rgba(30,24,48,.85);text-align:center}
.lockbox .hand{font-size:2.6rem;line-height:1}
.lockbox p{color:var(--muted)}
.lockbox input{font:inherit;font-size:1.1rem;text-align:center;letter-spacing:.2em;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--night);color:var(--ink)}
.lockbox input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#yes2{background:var(--rose);color:#2a0f1c}
#pwerr{color:var(--rose);min-height:1.4em;font-size:.95rem}
html,body{height:100%}
@media (max-width:420px){.stat b{font-size:1.7rem}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="lock" hidden>
  <form id="lockform" class="lockbox">
    <span class="hand">Диёрим,</span>
    <p>Бу саҳифа фақат сен учун. Паролни киритинг.</p>
    <label for="pw" class="label">Парол</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" required>
    <button id="yes2" type="submit">Очиш</button>
    <p id="pwerr" aria-live="polite"></p>
  </form>
</div>
<main></main>

  const d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const lock = document.getElementById('lock');
  document.body.classList.add('locked'); lock.hidden = false;
  setTimeout(() => document.getElementById('pw').focus(), 50);
  const btn = document.getElementById('yes2'), err = document.getElementById('pwerr');
  document.getElementById('lockform').addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; err.textContent = 'Текширяпман…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value.trim()), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:d(SALT), iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:d(IV)}, key, d(CT));
      document.querySelector('main').innerHTML = new TextDecoder().decode(plain);
      lock.hidden = true; document.body.classList.remove('locked'); scrollTo(0,0);
      if(window.initMain) window.initMain();
    } catch(x) {
      err.textContent = 'Парол нотўғри 🙈';
    }
    btn.disabled = false;
  });
})();
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const c = document.getElementById('sky'), x = c.getContext('2d');
  let w, h, stars = [], blobs = [], hearts = [];
  function size(){
    w = c.width = innerWidth * devicePixelRatio;
    h = c.height = innerHeight * devicePixelRatio;
    stars = Array.from({length: 140}, () => ({x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.4*devicePixelRatio + .3, p: Math.random()*6.28}));
    const cols = ['255,143,177','255,210,122','150,120,255','110,200,230'];
    blobs = cols.map((col, i) => ({col, x: w*(.2 + .2*i), y: h*(.25 + .15*(i%2)), r: Math.max(w,h)*.35, a: i*1.7}));
  }
  function draw(t){
    x.clearRect(0,0,w,h);
    blobs.forEach(b => {
      const bx = b.x + Math.sin(t/9000 + b.a)*w*.08, by = b.y + Math.cos(t/11000 + b.a)*h*.06;
      const g = x.createRadialGradient(bx,by,0,bx,by,b.r);
      g.addColorStop(0, 'rgba('+b.col+',.16)'); g.addColorStop(1, 'rgba('+b.col+',0)');
      x.fillStyle = g; x.fillRect(0,0,w,h);
    });
    stars.forEach(s => {
      x.globalAlpha = .45 + .45*Math.sin(t/900 + s.p);
      x.fillStyle = '#fff'; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill();
    });
    x.globalAlpha = 1;
    hearts = hearts.filter(hh => hh.life > 0);
    hearts.forEach(hh => {
      hh.x += hh.vx + (hh.float ? Math.sin(t/700 + hh.life/30)*.4*devicePixelRatio : 0);
      hh.y += hh.vy; if(!hh.float) hh.vy += .04*devicePixelRatio; hh.life--;
      x.globalAlpha = Math.min(1, hh.life/40);
      x.font = (hh.s*devicePixelRatio)+'px serif'; x.fillText(hh.ch, hh.x, hh.y);
    });
    x.globalAlpha = 1;
    if(!reduce) requestAnimationFrame(draw);
  }
  function burst(px, py, count, up){
    for(let i = 0; i < count; i++){
      hearts.push({ch: ['❤️','🫶','💗','✨','💕'][i%5], x: px*devicePixelRatio, y: py*devicePixelRatio,
        vx: (Math.random()-.5)*5*devicePixelRatio, vy: -(Math.random()*4 + (up||2))*devicePixelRatio, s: 12 + Math.random()*16, life: 90 + Math.random()*60});
    }
  }
  if(!reduce){
    setInterval(() => {
      if(document.hidden || hearts.length > 160) return;
      hearts.push({ch: ['💗','❤️','💕'][Math.floor(Math.random()*3)], x: Math.random()*w, y: h + 20,
        vx: (Math.random()-.5)*.6*devicePixelRatio, vy: -(Math.random()*1.2 + .8)*devicePixelRatio, s: 10 + Math.random()*14, life: 420, float: true});
    }, 700);
  }
  addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    burst(e.clientX, e.clientY, 14, 2);
    if(reduce) draw(0);
  });
  addEventListener('resize', () => { size(); if(reduce) draw(0); });
  size(); reduce ? draw(0) : requestAnimationFrame(draw);

  window.initMain = function(){
  const yes = document.getElementById('yes'), no = document.getElementById('no'), ans = document.getElementById('answer');
  const noLines = ['Ростданми? 🥺','Яна бир ўйлаб кўр','Тугма қочиб кетди 😅','Барибир «ҳа» дейсан'];
  let n = 0;
  function dodge(){
    ans.textContent = noLines[n++ % noLines.length];
    if(reduce) return;
    const box = no.parentElement.getBoundingClientRect();
    const dx = (Math.random() - .5) * Math.min(260, box.width - 120);
    const dy = (Math.random() - .5) * 60;
    no.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
  no.addEventListener('mouseenter', dodge);
  no.addEventListener('click', dodge);
  yes.addEventListener('click', () => {
    ans.textContent = 'Билардим. Сен менинг ҳаётимсан ❤️';
    no.style.display = 'none';
    const r = yes.getBoundingClientRect();
    for(let i = 0; i < 60; i++){
      hearts.push({ch: ['❤️','🫶','💗','✨'][i%4], x: (r.left + r.width/2)*devicePixelRatio, y: r.top*devicePixelRatio,
        vx: (Math.random()-.5)*6*devicePixelRatio, vy: -(Math.random()*5 + 3)*devicePixelRatio, s: 14 + Math.random()*16, life: 120 + Math.random()*60});
    }
    if(reduce) draw(0);
  });
  };
})();
</script>
